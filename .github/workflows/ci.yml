name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # 1.x cannot read this repo's lockfile (v5) and fails obscurely.
          deno-version: v2.x

      # Each step is the same task a contributor runs locally, so a red check
      # names the command that reproduces it.
      - name: fmt
        run: deno task fmt:check

      - name: lint
        run: deno task lint

      - name: check
        run: deno task check

      # Rasterization runs headless against the vendored fonts in assets/, so
      # no browser or system font packages are needed.
      #
      # DIAGNOSTIC: one process per test file. `deno task test` segfaults (139)
      # on ubuntu partway through diagram-api.test.js, at a different test each
      # run, which points at native canvas state accumulating across the run
      # rather than at one assertion. Running each file in a fresh process tells
      # us whether that is the mechanism, and names the file if it is not.
      - name: test
        run: |
          rc=0
          for f in tests/*.test.js; do
            echo "::group::$f"
            if deno test --no-check --allow-read --allow-write --allow-net \
                 --allow-env --allow-ffi --allow-run --unstable-ffi "$f"; then
              echo "$f OK"
            else
              echo "$f EXIT $?"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
