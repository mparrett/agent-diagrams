name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates are platform-independent, so they run on the cheap runner.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          # 1.x cannot read this repo's lockfile (v5) and fails obscurely.
          deno-version: v2.x

      # Each step is the same task a contributor runs locally, so a red check
      # names the command that reproduces it.
      - name: fmt
        run: deno task fmt:check
      - name: lint
        run: deno task lint
      - name: check
        run: deno task check

  # The whole suite on both platforms. Linux used to skip every rasterizing
  # test because the renderer died with SIGSEGV there; the cause was freed font
  # buffers (docs/project_notes/upstream-defects.md, fault 4), not the platform.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: test
        run: deno task test
